# Copy this file to configs/geometry.local.yaml when tuning Phase-2 geometry.
# All distances and depth tolerances are relative because the current depth map
# is non-metric.

representative_depth:
  # Bottom portion of person-mask pixels used for the representative point.
  person_bottom_fraction: 0.10
  minimum_valid_pixels: 5
  # Centered ROI width and height as fractions of the load bounding box.
  load_inner_size_fraction: 0.20

load_anchors:
  # Radius 5 px gives an 11x11 patch around each grid center.
  patch_size: 11
  patch_stride: 12
  seed_depth_tolerance: 0.30

connected_region:
  neighbor_radius: 1
  local_neighbor_depth_tolerance: 0.05

farthest_point_sampling:
  maximum_anchors: 16
  minimum_distance: 0.0

pseudo_bev:
  lateral_scale: 1.0
  longitudinal_scale: 1.0
  minimum_depth: 0.000001

zones:
  # Danger ratios expand the footprint; warning ratios then expand danger.
  danger:
    lateral_ratio: 0.15
    longitudinal_ratio: 0.20
  warning:
    lateral_ratio: 0.30
    longitudinal_ratio: 0.40
