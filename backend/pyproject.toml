[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crane-load-warning-backend"
version = "0.1.0"
description = "Offline computer-vision pipeline for crane under-load safety"
requires-python = ">=3.11,<3.14"
dependencies = [
    # depth-anything-3 0.1.1 imports addict but omits it from Requires-Dist.
    "addict>=2.4",
    "depth-anything-3>=0.1.1",
    "fastapi>=0.115,<1",
    "imageio-ffmpeg>=0.5,<1",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=10",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0",
    "rfdetr>=1.9",
    "torch>=2.2",
    "ultralytics>=8.3",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
